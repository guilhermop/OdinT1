<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path</title>
    <link rel="stylesheet" href="Pathstyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jockey+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

</head>

<body>

    <div class="container">
        <div class="panel-left"> 
            <div class="overlay">
                <img src="logo.png" alt="logo" class="logo" />
                <h1 class="projeto-nome">Path</h1>
            </div>
        </div>
        <div class="panel-right">
            <div class="panel-right-top">
                <p class="quote">“If you know the way broadly you will see it in everything.” </p>
                <span class="quote-autor">― Miyamoto Musashi</span>
            </div>
            <div class="panel-right-botton">
                <p class="botton-text">Join us, follow your path.</p>
            </div>
            <div class="panel-right-middle">
                <p class="texto-meio">Credentials</p>
                <form class="path-form" id="pathForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">First Name</label>
                            <input type="text" id="firstname" name="firstname" required />
                        </div>
                        <div class="form-group">
                            <label for="lastname">Last Name</label>
                            <input type="text" id="lastname" name="lastname" required />
                        </div>
                    </div>
                        <!-- second -->   
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required />
                        </div>
                        <div class="form-group">
                            <label for="phonenumber">Phone number</label>
                            <input type="tel" id="phonenumber" name="phonenumber" required />
                        </div>   
                    </div>
                    <!-- Third --> 
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required  oninput="document.getElementById('confirmpassword').pattern = this.value" />
                        </div>
                        <div class="form-group">
                            <label for="confirmpassword">Confirm Password</label>
                            <input type="password" id="confirmpassword" name="confirmpassword" required />
                        </div>   
                    </div>    
                    
                </form>
            </div>
            <div class="panel-right-botton3">
                <button type="submit" form="pathForm" class="btn-submit">Start the journey</button>
            </div>
        </div>
    </div>

    <script>
    const form = document.getElementById('pathForm');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const dados = {
            firstname: document.getElementById('firstname').value,
            lastname: document.getElementById('lastname').value,
            email: document.getElementById('email').value,
            phonenumber: document.getElementById('phonenumber').value,
            timestamp: new Date().toLocaleString('pt-BR')
        };

        const lista = JSON.parse(localStorage.getItem('pathUsuarios') || '[]');
        lista.push(dados);
        localStorage.setItem('pathUsuarios', JSON.stringify(lista));

        alert('Dados salvos com sucesso!');
        form.reset();
    });
</script>

</body>
</html>
